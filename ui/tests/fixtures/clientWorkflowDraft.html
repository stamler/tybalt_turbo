<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Client workflow return</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { mount } from "svelte";
      import History from "/src/lib/components/jobs/JobValueHistory.svelte";
      import { keepClientWorkflowDraft } from "/src/lib/clientWorkflowNavigation.ts";
      import { globalStore } from "$lib/stores/global";
      import { pb } from "$lib/pocketbase";
      import fixture from "./clientWorkflowDraft.json";
      import "/src/app.css";
      const reloaded = new URL(location.href).searchParams.has("reloaded");
      history.replaceState({}, "", "/jobs/job1/details");
      globalStore.set({ claims: ["job"] });
      pb.authStore.save("test-token", { id: "reviewer", collectionName: "users" });
      const file = new File(["%PDF-1.7\nExample\n%%EOF"], "kept-authorization.pdf", {
        type: "application/pdf",
      });
      const href = keepClientWorkflowDraft(
        "job-value:job1",
        "reviewer",
        {
          jobId: "job1",
          editing: fixture.editing,
          value: 2400,
          approver: "reviewer",
          documentFile: reloaded ? {} : file,
          documentName: file.name,
          correctionJob: { ...fixture.job, description: "Unsaved corrected scope" },
          correctionAllocations: [{ division: "division1", hours: 42 }],
          originalRate: "rate1",
          jobUpdated: fixture.job.updated,
          jobReviewToken: "old-related-token",
          originalAllocations: JSON.stringify(fixture.allocations),
        },
        "client1",
        "contact1",
      );
      history.replaceState(
        {},
        "",
        new URL(href, location.origin).searchParams.get("workflow_return"),
      );
      mount(History, {
        target: document.getElementById("app"),
        props: { jobId: "job1", effectiveValue: 1000 },
      });
    </script>
  </body>
</html>
